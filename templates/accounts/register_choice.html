{% extends "base.html" %}
{% load static %}
{% block content %}
<main class="py-5 mt-4">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="fw-bold">Create your account</h1>
      <p class="text-muted mb-0">Choose how you want to use Client Hub.</p>
    </div>
    <div class="row g-4 justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <div class="mb-3 text-primary"><i class="bi bi-briefcase fs-2"></i></div>
            <h4 class="mb-2">I am a client</h4>
            <p class="text-muted">Post projects, review talent, and hire fast.</p>
            <a class="btn btn-primary w-100" href="{% url 'accounts:register_client' %}">Continue</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-5">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <div class="mb-3 text-primary"><i class="bi bi-person-badge fs-2"></i></div>
            <h4 class="mb-2">I am a freelancer</h4>
            <p class="text-muted">Showcase your skills and get matched.</p>
            <a class="btn btn-primary w-100" href="{% url 'accounts:register_freelancer' %}">Continue</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
